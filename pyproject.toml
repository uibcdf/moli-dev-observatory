[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "moli-dev-observatory"
version = "0.1.0"
description = "Development observability for the MOLI platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "UIBCDF"}]
dependencies = []

[project.scripts]
moli-dev-observatory = "moli_dev_observatory.core:main"

[tool.setuptools]
packages = ["moli_dev_observatory"]
